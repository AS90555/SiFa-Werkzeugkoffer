<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Sifa-Werkzeugkoffer Aufnahme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: eine Spalte, oben fester Kopf mit Betrieb und vier Sichten; Stationen als Kette, Details als Blätter darunter. */
:root{--grund:#f3f5f8;--flaeche:#ffffff;--tinte:#18222e;--leise:#5b6878;--linie:#d5dbe3;--akzent:#1d5aa8;--akzent-tinte:#ffffff;--pflicht:#a8321d;--pflicht-grund:#fbe9e5;--gut:#1f7a4d;--gut-grund:#e3f3ea;--offen:#8a5a00;--offen-grund:#fcf1d8;--neutral-grund:#e8ecf1;
--f-kopf:"Space Grotesk",system-ui,sans-serif;--f-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grund:#10161d;--flaeche:#18212b;--tinte:#e6ebf1;--leise:#9aa7b6;--linie:#2c3947;--akzent:#6ea8ee;--akzent-tinte:#0c1520;--pflicht:#ff9c88;--pflicht-grund:#3a1d18;--gut:#6fd3a0;--gut-grund:#143225;--offen:#f0c060;--offen-grund:#3a2c0c;--neutral-grund:#222e3b;color-scheme:dark}}
:root[data-theme="dark"]{--grund:#10161d;--flaeche:#18212b;--tinte:#e6ebf1;--leise:#9aa7b6;--linie:#2c3947;--akzent:#6ea8ee;--akzent-tinte:#0c1520;--pflicht:#ff9c88;--pflicht-grund:#3a1d18;--gut:#6fd3a0;--gut-grund:#143225;--offen:#f0c060;--offen-grund:#3a2c0c;--neutral-grund:#222e3b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--grund);color:var(--tinte);font:15px/1.5 var(--f-text);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--flaeche)}
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--flaeche);border-bottom:1px solid var(--linie)}
.innen{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kopf .innen{display:flex;flex-direction:column;gap:8px;padding-block:10px 0}
.betrieb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.betrieb h1{font:600 18px/1.2 var(--f-kopf);margin:0;text-wrap:balance}
.betrieb small{color:var(--leise)}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--leise);font:500 14px var(--f-text);padding:8px 10px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{color:var(--tinte);border-bottom-color:var(--akzent)}
main.innen{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h2{font:600 17px/1.3 var(--f-kopf);margin:0;text-wrap:balance}
h3{font:600 14px/1.3 var(--f-text);margin:0}
p{margin:0}.leise{color:var(--leise)}.klein{font-size:13px}
.blatt{background:var(--flaeche);border:1px solid var(--linie);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kette{display:flex;flex-direction:column;gap:0}
.station{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--flaeche);border:1px solid var(--linie);border-bottom-width:0;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.station:first-child{border-radius:8px 8px 0 0}.station:last-child{border-bottom-width:1px;border-radius:0 0 8px 8px}.station:only-child{border-radius:8px}
.station:hover{background:var(--neutral-grund)}
.nr{font:600 13px var(--f-kopf);color:var(--leise);font-variant-numeric:tabular-nums}
.station b{font-weight:600}.station .unter{color:var(--leise);font-size:13px;display:block}
.marken{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.marke{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neutral-grund);color:var(--leise);white-space:nowrap;font-variant-numeric:tabular-nums}
.marke.offen{background:var(--offen-grund);color:var(--offen)}.marke.pflicht{background:var(--pflicht-grund);color:var(--pflicht)}.marke.gut{background:var(--gut-grund);color:var(--gut)}
button,select,input,textarea{font:inherit;color:inherit}
.knopf{background:var(--akzent);color:var(--akzent-tinte);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.knopf.zweit{background:var(--neutral-grund);color:var(--tinte)}.knopf.klein{padding:4px 10px;font-size:13px}
.knopf:focus-visible,.station:focus-visible,nav button:focus-visible,.wahl button:focus-visible,.chip:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--flaeche);border:1px solid var(--linie);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--leise);min-width:0}
.reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.reihe>*{flex:1 1 180px}.reihe>.fest{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linie);background:var(--flaeche);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-tinte)}
.schritt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--linie);padding-top:8px}
.schritt:first-of-type{border-top:0;padding-top:0}
.gef{border-top:1px solid var(--linie);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.gef:first-of-type{border-top:0;padding-top:0}
.gefkopf{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.mass{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;align-items:start}
.art{font:600 12px var(--f-kopf);color:var(--leise);padding-top:2px}
.wahl{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.wahl button{border:1px solid var(--linie);background:var(--flaeche);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.wahl button[aria-pressed="true"][data-w="ok"]{background:var(--gut-grund);color:var(--gut);border-color:var(--gut)}
.wahl button[aria-pressed="true"][data-w="fehlt"]{background:var(--pflicht-grund);color:var(--pflicht);border-color:var(--pflicht)}
.wahl button[aria-pressed="true"][data-w="entfaellt"]{background:var(--neutral-grund);border-color:var(--leise)}
.quelle{font-size:12px;color:var(--leise)}
.tabelle{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linie);vertical-align:top}th{font-size:12px;color:var(--leise);font-weight:600}
td.z{font-variant-numeric:tabular-nums;white-space:nowrap}
.hinweis{background:var(--offen-grund);color:var(--offen);border-radius:6px;padding:8px 10px;font-size:13px}
.zurueck{background:none;border:0;color:var(--akzent);padding:0;cursor:pointer;font-weight:600;align-self:flex-start}
.chips .marke{white-space:normal}.gefkopf h3{min-width:0}
main h2{margin-top:4px}
</style>
<header class="kopf"><div class="innen" id="kopf"></div></header>
<main class="innen" id="inhalt"></main>
<script>
const KERN={};KERN.laden=(function(){const module={exports:{}};const require=function(x){if(x==='./laden')return KERN.laden;return {};};
// Lädt die Bibliothek und prüft sie streng. Ein Fehler in den Daten bricht ab, statt still falsch zu rechnen.
const fs = require('fs');
const path = require('path');

const STUFEN = ['pflicht', 'vermutungswirkung', 'empfehlung'];
const BELEG = ['geprueft', 'offen', 'ohne-beleg'];
const FREIGABE = ['entwurf', 'geprueft', 'gesperrt'];
const ART = ['S', 'T', 'O', 'P'];
const TYPEN = ['material', 'vorgang', 'ausfuehrung', 'umgebung'];
const PRAEFIX = { material: 'm.', vorgang: 'v.', ausfuehrung: 'a.', umgebung: 'u.' };

// Fingerabdruck: ändert sich, sobald sich fachlich etwas an Regel oder Pflicht ändert. Fundstellen zählen nicht mit.
function fingerabdruck(e) {
  const kern = e.massnahmen
    ? { wenn: e.wenn, entsteht: e.entsteht, gefaehrdung: e.gefaehrdung, verbindlichkeit: e.verbindlichkeit, massnahmen: e.massnahmen.map(m => [m.id, m.art, m.text, m.grundlage || '']) }
    : { wenn: e.wenn, pflicht: e.pflicht };
  const s = JSON.stringify(kern); let a = 0x811c9dc5, b = 0x1b873593;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 0x01000193); b = Math.imul(b ^ c, 0x85ebca6b) ^ (b >>> 13); }
  return (a >>> 0).toString(16).padStart(8, '0') + (b >>> 0).toString(16).padStart(8, '0');
}

// Beleg und Freigabe gelten nur für genau den Stand, der geprüft wurde.
function pruefeStand(e, p, f, quellen) {
  if (e.belegstand) {
    if (e.beleg !== 'geprueft') f.push(`${p}: Belegstand vorhanden, aber Beleg nicht geprüft`);
    else if (e.belegstand.fingerabdruck !== fingerabdruck(e)) f.push(`${p}: nach der Beleg-Prüfung geändert. Beleg zurücksetzen mit: node beleg/stand.js --bereinigen`);
  }
  if (e.freigabe === 'geprueft') {
    if (!e.freigegeben || !e.freigegeben.von) f.push(`${p}: freigegeben, aber ohne Angabe, wer freigegeben hat`);
    else if (e.freigegeben.fingerabdruck !== fingerabdruck(e)) f.push(`${p}: nach der Freigabe geändert. Freigabe zurücksetzen mit: node beleg/stand.js --bereinigen`);
    if (!e.belegstand || e.belegstand.pruefungen < 2) f.push(`${p}: freigegeben ohne doppelt geprüften Beleg`);
  }
  for (const m of e.massnahmen || []) {
    if (m.grundlage !== undefined && m.grundlage !== 'erfahrung') f.push(`${p}: Maßnahme ${m.id} hat unbekannte Grundlage ${m.grundlage}`);
    if (m.beleg && !quellen.has(m.beleg.quelle)) f.push(`${p}: Maßnahme ${m.id} verweist auf unbekannte Quelle ${m.beleg.quelle}`);
  }
}

function lies(ordner, name) {
  return JSON.parse(fs.readFileSync(path.join(ordner, name + '.json'), 'utf8'));
}

function doppelte(liste) {
  const gesehen = new Set(), dop = new Set();
  for (const x of liste) (gesehen.has(x) ? dop : gesehen).add(x);
  return [...dop];
}

function atome(ausdruck, pfad, fehler, sammel) {
  if (ausdruck === 'immer') return;
  if (typeof ausdruck === 'string') { sammel.merkmale.add(ausdruck); return; }
  if (!ausdruck || typeof ausdruck !== 'object' || Array.isArray(ausdruck)) { fehler.push(`${pfad}: Bedingung ist weder Merkmal noch Objekt`); return; }
  const schluessel = Object.keys(ausdruck);
  if ('angabe' in ausdruck) {
    const ok = schluessel.every(k => ['angabe', 'ist', 'ab', 'bis'].includes(k)) && schluessel.length === 2;
    if (!ok) fehler.push(`${pfad}: Angabe-Bedingung braucht genau eines von ist, ab, bis`);
    sammel.angaben.add(ausdruck.angabe); return;
  }
  if (schluessel.length !== 1) { fehler.push(`${pfad}: genau ein Operator erlaubt, gefunden ${schluessel.join(', ')}`); return; }
  const op = schluessel[0], wert = ausdruck[op];
  if (op === 'alle' || op === 'eine') {
    if (!Array.isArray(wert) || wert.length === 0) { fehler.push(`${pfad}: ${op} braucht eine nicht leere Liste`); return; }
    wert.forEach((w, i) => atome(w, `${pfad}.${op}[${i}]`, fehler, sammel));
  } else if (op === 'nicht') atome(wert, `${pfad}.nicht`, fehler, sammel);
  else fehler.push(`${pfad}: unbekannter Operator ${op}`);
}

function pruefe(b) {
  const f = [];
  const merkmale = new Set(Object.keys(b.merkmale));
  const angaben = new Map(b.angaben.map(a => [a.id, a]));
  const quellen = new Map(b.quellen.map(q => [q.id, q]));
  const gef = new Map(b.gefaehrdungen.map(g => [g.id, g]));

  for (const d of doppelte(b.angaben.map(a => a.id))) f.push(`angaben: Kennung doppelt ${d}`);
  for (const a of b.angaben) if (!['ja_nein', 'zahl'].includes(a.typ)) f.push(`angaben ${a.id}: unbekannter Typ ${a.typ}`);
  for (const d of doppelte(b.quellen.map(q => q.id))) f.push(`quellen: Kennung doppelt ${d}`);
  for (const q of b.quellen) if (!STUFEN.includes(q.stufe)) f.push(`quellen ${q.id}: unbekannte Stufe ${q.stufe}`);
  for (const d of doppelte(b.gefaehrdungen.map(g => g.id))) f.push(`gefaehrdungen: Kennung doppelt ${d}`);
  const faktNr = new Set(((b.faktoren || {}).faktoren || []).map(x => x.nr));
  if (b.faktoren && faktNr.size !== 11) f.push('faktoren: Es müssen genau elf Gefährdungsfaktoren sein');
  for (const g of b.gefaehrdungen) if (!(Number.isInteger(g.faktor) && g.faktor >= 1 && g.faktor <= 11) || (b.faktoren && !faktNr.has(g.faktor))) f.push(`gefaehrdungen ${g.id}: Faktor muss 1 bis 11 sein`);

  for (const typ of TYPEN) {
    const liste = b.stammdaten[typ];
    if (!Array.isArray(liste)) { f.push(`stammdaten: ${typ} fehlt`); continue; }
    for (const d of doppelte(liste.map(x => x.id))) f.push(`stammdaten ${typ}: Kennung doppelt ${d}`);
    for (const x of liste) for (const m of x.merkmale) {
      if (!merkmale.has(m)) f.push(`stammdaten ${typ}/${x.id}: unbekanntes Merkmal ${m}`);
      else if (!m.startsWith(PRAEFIX[typ])) f.push(`stammdaten ${typ}/${x.id}: Merkmal ${m} gehört nicht zu ${typ}`);
    }
  }

  const verwendet = new Set();
  for (const d of doppelte(b.regeln.map(r => r.id))) f.push(`regeln: Kennung doppelt ${d}`);
  for (const d of doppelte(b.regeln.flatMap(r => (r.massnahmen || []).map(m => m.id)))) f.push(`regeln: Maßnahmen-Kennung doppelt ${d}`);
  for (const r of b.regeln) {
    const p = `regel ${r.id}`;
    for (const feld of ['id', 'name', 'wenn', 'entsteht', 'gefaehrdung', 'massnahmen', 'quellen', 'verbindlichkeit', 'beleg', 'freigabe'])
      if (r[feld] === undefined) f.push(`${p}: Feld ${feld} fehlt`);
    if (!gef.has(r.gefaehrdung)) f.push(`${p}: unbekannte Gefährdung ${r.gefaehrdung}`);
    if (!STUFEN.includes(r.verbindlichkeit)) f.push(`${p}: unbekannte Verbindlichkeit ${r.verbindlichkeit}`);
    if (!BELEG.includes(r.beleg)) f.push(`${p}: unbekannter Belegstatus ${r.beleg}`);
    if (!FREIGABE.includes(r.freigabe)) f.push(`${p}: unbekannte Freigabe ${r.freigabe}`);
    if (!Array.isArray(r.massnahmen) || r.massnahmen.length === 0) f.push(`${p}: keine Maßnahme`);
    for (const m of r.massnahmen || []) {
      if (!ART.includes(m.art)) f.push(`${p}: Maßnahme ${m.id} hat unbekannte Art ${m.art}`);
      if (!m.id.startsWith(r.id + '-')) f.push(`${p}: Maßnahmen-Kennung ${m.id} passt nicht zur Regel`);
    }
    for (const q of r.quellen || []) if (!quellen.has(q.id)) f.push(`${p}: unbekannte Quelle ${q.id}`);
    if (r.beleg !== 'ohne-beleg' && (r.quellen || []).length === 0) f.push(`${p}: ohne Quelle, aber nicht als ohne-beleg markiert`);
    if (r.beleg === 'ohne-beleg' && (r.quellen || []).length > 0) f.push(`${p}: als ohne-beleg markiert, hat aber Quellen`);
    if (r.beleg === 'geprueft' && (r.quellen || []).some(q => !q.stelle)) f.push(`${p}: Beleg geprüft, aber eine Fundstelle fehlt`);
    if (r.freigabe === 'geprueft' && r.beleg !== 'geprueft') f.push(`${p}: freigegeben ohne geprüften Beleg`);
    pruefeStand(r, p, f, quellen);
    const sammel = { merkmale: new Set(), angaben: new Set() };
    atome(r.wenn, `${p}.wenn`, f, sammel);
    for (const m of sammel.merkmale) { if (!merkmale.has(m)) f.push(`${p}: unbekanntes Merkmal ${m}`); verwendet.add(m); }
    for (const a of [...sammel.angaben, ...(r.braucht || [])]) if (!angaben.has(a)) f.push(`${p}: unbekannte Angabe ${a}`);
  }
  // Organisationspflichten
  for (const d of doppelte((b.pflichten || []).map(x => x.id))) f.push(`pflichten: Kennung doppelt ${d}`);
  for (const x of b.pflichten || []) {
    const p = `pflicht ${x.id}`;
    for (const feld of ['id', 'name', 'wenn', 'pflicht', 'nachweis', 'quellen', 'beleg', 'freigabe']) if (x[feld] === undefined) f.push(`${p}: Feld ${feld} fehlt`);
    if (!BELEG.includes(x.beleg)) f.push(`${p}: unbekannter Belegstatus ${x.beleg}`);
    if (!FREIGABE.includes(x.freigabe)) f.push(`${p}: unbekannte Freigabe ${x.freigabe}`);
    for (const q of x.quellen || []) if (!quellen.has(q.id)) f.push(`${p}: unbekannte Quelle ${q.id}`);
    if (!(x.quellen || []).length) f.push(`${p}: ohne Quelle`);
    if (x.beleg === 'geprueft' && (x.quellen || []).some(q => !q.stelle)) f.push(`${p}: Beleg geprüft, aber eine Fundstelle fehlt`);
    if (x.freigabe === 'geprueft' && x.beleg !== 'geprueft') f.push(`${p}: freigegeben ohne geprüften Beleg`);
    pruefeStand(x, p, f, quellen);
    const sammel = { merkmale: new Set(), angaben: new Set() };
    atome(x.wenn, `${p}.wenn`, f, sammel);
    for (const m of sammel.merkmale) { if (!merkmale.has(m)) f.push(`${p}: unbekanntes Merkmal ${m}`); verwendet.add(m); }
    for (const a of sammel.angaben) { if (!angaben.has(a)) f.push(`${p}: unbekannte Angabe ${a}`); else if (angaben.get(a).ebene !== 'betrieb') f.push(`${p}: Angabe ${a} ist keine Betriebsangabe`); }
  }
  // Wörterbuch
  const idx = {}; for (const t of TYPEN) idx[t] = new Set((b.stammdaten[t] || []).map(x => x.id));
  const worte = (b.woerterbuch || []).flatMap(w => w.worte || []);
  for (const d of doppelte(worte)) f.push(`woerterbuch: Wort doppelt ${d}`);
  for (const w of b.woerterbuch || []) {
    const p = `woerterbuch ${(w.worte || [])[0]}`;
    if (!Array.isArray(w.worte) || !w.worte.length) f.push('woerterbuch: Eintrag ohne Worte');
    for (const x of w.worte || []) if (x !== x.toLowerCase()) f.push(`${p}: Worte klein schreiben (${x})`);
    if (w.vorgang && !idx.vorgang.has(w.vorgang)) f.push(`${p}: unbekannter Vorgang ${w.vorgang}`);
    if (w.ausfuehrung && !idx.ausfuehrung.has(w.ausfuehrung)) f.push(`${p}: unbekannte Ausführung ${w.ausfuehrung}`);
    for (const m of w.material || []) if (!idx.material.has(m)) f.push(`${p}: unbekanntes Material ${m}`);
    for (const u of w.umgebung || []) if (!idx.umgebung.has(u)) f.push(`${p}: unbekannte Umgebung ${u}`);
    for (const a of Object.keys(w.angabe || {})) if (!angaben.has(a)) f.push(`${p}: unbekannte Angabe ${a}`);
  }
  const vergeben = new Set(TYPEN.flatMap(t => (b.stammdaten[t] || []).flatMap(x => x.merkmale)));
  const hinweise = [];
  for (const m of verwendet) if (!vergeben.has(m)) hinweise.push(`Merkmal ${m} steht in einer Regel, wird aber von keinem Stammdatum getragen`);
  for (const m of merkmale) if (!verwendet.has(m)) hinweise.push(`Merkmal ${m} wird von keiner Regel genutzt`);
  return { fehler: f, hinweise };
}

function ladeBibliothek(ordner) {
  const b = {};
  for (const n of ['merkmale', 'angaben', 'stammdaten', 'quellen', 'gefaehrdungen', 'faktoren', 'regeln', 'pflichten', 'woerterbuch']) b[n] = lies(ordner, n);
  const { fehler, hinweise } = pruefe(b);
  if (fehler.length) { const e = new Error('Bibliothek fehlerhaft:\n- ' + fehler.join('\n- ')); e.fehler = fehler; throw e; }
  b.hinweise = hinweise;
  return b;
}

function pruefeFall(b, fall) {
  const f = [];
  const index = {}; for (const t of TYPEN) index[t] = new Map(b.stammdaten[t].map(x => [x.id, x]));
  const angaben = new Map(b.angaben.map(a => [a.id, a]));
  const pruefAngaben = (obj, wo) => { for (const [k, v] of Object.entries(obj || {})) {

  function sPflichten(erg) {

      return a.typ === 'zahl' ? `<label>${esc(a.frage)}<input type="number" min="0" id="b-${a.id}" data-a-change="betrieb" data-v="${a.id}" value="${v == null ? '' : v}"></label>`

  function sStoffe() {

  function sDaten() {

    return `<div class="blatt"><h2>Betriebe</h2><div class="chips">${andere}</div>
        <div class="reihe"><label>Neuer Betrieb<input type="text" id="neu-fall" placeholder="Name des Betriebs"></label><button class="knopf fest" data-a="fall-neu">Anlegen</button></div></div>
      <div class="blatt"><h2>Sichern und übertragen</h2><p class="leise">Die Aufnahme liegt im Browser dieses Geräts. Zum Sichern oder für ein anderes Gerät den Text kopieren und dort einfügen. Der Text ist zugleich die Datei für den Projektordner.</p>
        <textarea id="fall-text" readonly>${esc(JSON.stringify(f, null, 1))}</textarea>
        <div class="reihe"><button class="knopf fest" data-a="kopieren">Text kopieren</button>${location.protocol === 'file:' ? '<button class="knopf zweit fest" data-a="datei">Als Datei speichern</button>' : ''}</div>
        <label>Fall einfügen<textarea id="fall-ein" placeholder="Hier den kopierten Text einfügen"></textarea></label><div class="reihe"><button class="knopf zweit fest" data-a="einlesen">Einlesen</button></div></div>
      <div class="blatt"><h2>Bibliothek</h2><p class="leise">${BIB.regeln.length} Regeln, davon ${BIB.regeln.filter(r => r.beleg === 'geprueft').length} mit am Text geprüftem Beleg und ${BIB.regeln.filter(r => r.freigabe === 'geprueft').length} fachlich freigegeben. ${S.material.length + S.vorgang.length + S.ausfuehrung.length + S.umgebung.length} Stammdaten, ${BIB.gefaehrdungen.length} Gefährdungen. Stand ${esc(STAND)}.</p>${fehlerBib.length ? `<div class="hinweis">${esc(fehlerBib.join(' · '))}</div>` : ''}</div>`;
  }
  function zeichne() {
    const erg = rechne();
    document.getElementById('kopf').innerHTML = sKopf();
    const m = document.getElementById('inhalt');
    m.innerHTML = (Z.meldung ? `<div class="hinweis">${esc(Z.meldung)}</div>` : '') + ({ ablauf: sAblauf, station: sStation, pflichten: sPflichten, stoffe: sStoffe, ergebnis: sErgebnis, daten: sDaten }[Z.sicht])(erg);
    Z.meldung = '';
  }

  // ---------- Aktionen
  const wert = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const station = () => fall().stationen.find(x => x.nr === Z.station);
  const AKT = {
    sicht: v => { Z.sicht = v; },
    station: v => { Z.station = Number(v); Z.sicht = 'station'; Z.entwurf = { material: [] }; window.scrollTo(0, 0); },
    'station-neu': () => { const n = wert('neu-station'); if (!n) { Z.meldung = 'Bitte einen Namen für den Arbeitsplatz eingeben.'; return; } const f = fall(); const nr = Math.max(0, ...f.stationen.map(s => s.nr)) + 1; Z.bereich = wert('neu-bereich'); f.stationen.push({ nr, name: n, bereich: Z.bereich || undefined, umgebung: ['halle'], angaben: {}, schritte: [], beobachtungen: [] }); Z.station = nr; Z.sicht = 'station'; Z.entwurf = { material: [] }; },
    'station-weg': () => { const f = fall(); const s = station(); if (!s.loeschen) { s.loeschen = true; Z.meldung = 'Zum Löschen noch einmal auf „Löschen“ tippen.'; return; } f.stationen = f.stationen.filter(x => x.nr !== s.nr); Z.sicht = 'ablauf'; },
    umgebung: v => { const s = station(); s.umgebung = s.umgebung || []; s.umgebung = s.umgebung.includes(v) ? s.umgebung.filter(x => x !== v) : [...s.umgebung, v]; },
    'entwurf-material': v => { const m = Z.entwurf.material; Z.entwurf.material = m.includes(v) ? m.filter(x => x !== v) : [...m, v]; },
    'schritt-neu': () => { const E = Z.entwurf; if (!E.vorgang || !E.ausfuehrung) { Z.meldung = 'Bitte Vorgang und Ausführung wählen.'; return; } station().schritte.push({ material: E.material, vorgang: E.vorgang, ausfuehrung: E.ausfuehrung }); Z.entwurf = { material: [] }; },
    'schritt-weg': v => { station().schritte.splice(Number(v), 1); },
    wunsch: () => { const t = wert('wunsch'); if (!t) return; const f = fall(); (f.wuensche = f.wuensche || []).push({ station: Z.station, text: t }); Z.meldung = 'Notiert. Der Wunsch steht unter Ergebnis.'; },
    'wunsch-weg': v => { fall().wuensche.splice(Number(v), 1); },
    'angabe-jn': v => { const [k, w] = v.split('|'); const s = station(); (s.angaben = s.angaben || {})[k] = w === '1'; },
    'angabe-weg': v => { delete station().angaben[v]; },
    pruef: v => { const [mid, w] = v.split('|'); const f = fall(); f.pruefung = f.pruefung || {}; const k = pk(Z.station, mid); if (f.pruefung[k] === w) delete f.pruefung[k]; else f.pruefung[k] = w; },
    'stoff-neu': () => { const n = wert('s-name'), d = wert('s-datum'), t = wert('s-h'); if (!n || !d) { Z.meldung = 'Bitte Handelsname und Datum des Datenblatts angeben. Ohne Datenblatt bleibt der Stoff offen.'; return; }
      const h = [...new Set((t.match(/\bH[2-4]\d\d[A-Za-z]{0,2}\b/g) || []))], euh = [...new Set(t.match(/\bEUH\d{3}[A-Z]?\b/g) || [])];
      const f = fall(); (f.stoffe = f.stoffe || []).push({ id: 'stoff-' + Date.now().toString(36), name: n, material: wert('s-art'), sdb: { version: wert('s-version'), datum: d }, h, euh }); Z.meldung = `Gespeichert mit ${h.length + euh.length ? [...h, ...euh].join(', ') : 'der Angabe „nicht eingestuft“'}.`; },
    'stoff-weg': v => { fall().stoffe.splice(Number(v), 1); },
    'beob-neu': () => { const t = wert('beob-text'); if (!t) return; const s = station(); (s.beobachtungen = s.beobachtungen || []).push({ text: t, gefaehrdung: wert('beob-gef') || null }); },
    'beob-weg': v => { station().beobachtungen.splice(Number(v), 1); },
    'betrieb-jn': v => { const [k, w] = v.split('|'); const f = fall(); (f.betrieb = f.betrieb || {})[k] = w === '1'; },
    pflicht: v => { const [id, w] = v.split('|'); const f = fall(); f.pflichtpruefung = f.pflichtpruefung || {}; if (f.pflichtpruefung[id] === w) delete f.pflichtpruefung[id]; else f.pflichtpruefung[id] = w; },
    fall: v => { Z.aktiv = v; Z.sicht = 'ablauf'; },
    'fall-neu': () => { const n = wert('neu-fall'); if (!n) { Z.meldung = 'Bitte einen Namen eingeben.'; return; } const id = 'fall-' + Date.now().toString(36); Z.faelle[id] = { id, name: n, betrieb: {}, angaben: {}, stoffe: [], stationen: [], pruefung: {}, pflichtpruefung: {}, wuensche: [] }; Z.aktiv = id; Z.sicht = 'ablauf'; },
    kopieren: () => { const t = document.getElementById('fall-text'); const fertig = () => { Z.meldung = 'Text kopiert.'; zeichne(); }; try { navigator.clipboard.writeText(t.value).then(fertig, () => { t.select(); }); } catch (e) { t.select(); } return 'ohne'; },
    datei: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(fall(), null, 1)], { type: 'application/json' })); a.download = fall().id + '.json'; a.click(); return 'ohne'; },
    einlesen: () => { try { const f = JSON.parse(wert('fall-ein')); pruefeFall(BIB, { ...f, stationen: f.stationen.filter(s => s.schritte.length) }); if (!f.id || !f.name) throw new Error('Kennung oder Name fehlt.'); delete f.beispiel; Z.faelle[f.id] = f; Z.aktiv = f.id; Z.sicht = 'ablauf'; Z.meldung = 'Fall eingelesen.'; } catch (e) { Z.meldung = 'Einlesen nicht möglich: ' + e.message; } }
  };
  const AEND = {
    entwurf: (v, w) => { Z.entwurf[v] = w; },
    'station-name': (v, w) => { if (w.trim()) station().name = w.trim(); },
    'station-bereich': (v, w) => { station().bereich = w.trim() || undefined; },
    'station-personen': (v, w) => { if (w === '') delete station().personen; else station().personen = Number(w); },
    betrieb: (v, w) => { const f = fall(); f.betrieb = f.betrieb || {}; if (w === '') delete f.betrieb[v]; else f.betrieb[v] = Number(w); },
    angabe: (v, w) => { const s = station(); s.angaben = s.angaben || {}; if (w === '') delete s.angaben[v]; else s.angaben[v] = Number(w); }
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const f = AKT[b.dataset.a]; if (!f) return; if (b.dataset.a !== 'station-weg' && Z.sicht === 'station' && station()) delete station().loeschen; if (f(b.dataset.v) === 'ohne') return; sichern(); zeichne(); });
  document.addEventListener('change', e => { const b = e.target.closest('[data-a-change]'); if (!b) return; AEND[b.dataset.aChange](b.dataset.v, b.value); sichern(); zeichne(); });
  laden(); zeichne();
})();

</script>
</body></html>
